<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventory Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>📦 Inventory Management System</h1></header>
  <main>
    <div id="message" class="message hidden"></div>
    <div id="lowStockBanner" class="alert hidden"></div>

    <section class="card">
      <h2>Add Product</h2>
      <form id="addForm">
        <input id="product_id" placeholder="Product ID" required>
        <input id="name" placeholder="Name" required>
        <input id="category" placeholder="Category" required>
        <input id="quantity" type="number" min="0" step="1" placeholder="Quantity" required>
        <input id="price" type="number" min="0" step="0.01" placeholder="Price (₹)" required>
        <button type="submit">Add Product</button>
      </form>
    </section>

    <section class="card">
      <h2>Products</h2>
      <input id="search" class="search" placeholder="🔍 Search by ID, name or category...">
      <table>
        <thead>
          <tr><th>ID</th><th>Name</th><th>Category</th><th>Qty</th><th>Price (₹)</th><th>Actions</th></tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
